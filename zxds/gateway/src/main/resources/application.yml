# ===== 服务器配置 =====
server:
  port: 8201                # 网关服务端口号

# ===== Spring 相关配置 =====
spring:
  application:
    name: gateway           # 应用名称（注册到 Nacos 时使用）
  config:
    import:
      # 可选导入 Nacos 上的公共配置 common.yaml（optional 表示找不到也不报错）
      - optional:nacos:common.yaml
  cloud:
    # ===== Nacos 配置 =====
    nacos:
      config:                     # Nacos 配置中心
        group: DEFAULT_GROUP      # 配置分组
        file-extension: yaml      # 配置文件格式
        server-addr: 192.168.48.200:8848   # Nacos 服务地址
        namespace: zxds           # 命名空间
        username: nacos           # 用户名
        password: abc123456       # 密码
      discovery:                  # Nacos 服务注册与发现
        namespace: zxds
        username: nacos
        password: abc123456
        server-addr: 192.168.48.200:8848
        group: DEFAULT_GROUP
        ip: 192.168.1.5        # 注册到 Nacos 的本机 IP

    # ===== Sentinel 限流/熔断配置 =====
    sentinel:
      transport:
        dashboard: 192.168.48.200:8858   # Sentinel 控制台地址

    # ===== Spring Cloud Gateway 网关配置 =====
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true       # 开启服务发现自动路由（根据服务名自动生成路由）

          # ===== 跨域配置（这是单独配置网关的跨域，网关也是一个微服务。） =====
          globalcors:
            add-to-simple-url-handler-mapping: true   # 让 OPTIONS 预检请求也能走跨域处理
            cors-configurations:
              '[/**]':                       # 对所有路径生效
                allowedOrigins:              # 允许的前端来源
                  - "http://localhost:3000"
                  - "http://127.0.0.1:3000"
                allowedMethods:              # 允许的请求方法
                  - "GET"
                  - "POST"
                  - "DELETE"
                  - "PUT"
                  - "OPTIONS"
                allowedHeaders: "*"          # 允许任意请求头
                allowCredentials: true       # 允许携带 Cookie 等凭证
                maxAge: 360000               # 预检请求结果缓存时间（秒）

          # ===== 路由规则 =====
          routes:
            # 路由一：司机端 BFF
            - id: bff-driver
              uri: lb://bff-driver           # lb 表示从注册中心负载均衡地转发
              predicates:
                - Path=/zxds-driver/**       # 匹配以 /zxds-driver/ 开头的请求
              filters:
                - StripPrefix=1              # 转发前去掉一层路径前缀（去掉 /zxds-driver）
            - id: bff-customer
              uri: lb://bff-customer
              predicates:
                - Path=/zxds-customer/**
              filters:
                - StripPrefix=1

            # 路由二：管理后台 API
            - id: zxds-mis-api
              uri: lb://zxds-mis-api
              predicates:
                - Path=/zxds-mis-api/**
              filters:
                - StripPrefix=1

            - id: zxds-odr
              uri: lb://zxds-odr
              predicates:
                - Path=/zxds-odr/**
              filters:
                - StripPrefix=1
    # ===== 负载均衡配置 =====
    loadbalancer:
      nacos:
        enabled: true       # 使用 Nacos 作为负载均衡的服务发现来源

# ===== Feign 配置 =====
feign:
  sentinel:
    enabled: true           # 开启 Feign 与 Sentinel 整合（支持熔断降级）

# ===== Spring Boot Actuator 监控端点配置 =====
management:
  endpoints:
    web:
      exposure:
        include: "*"        # 暴露所有监控端点（生产环境建议按需开放）