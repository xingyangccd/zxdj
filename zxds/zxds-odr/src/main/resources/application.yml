server:
  jetty:
    threads:
      acceptors: 4
      selectors: 8
  port: 8002
  servlet:
    context-path: /

spring:
  config:
    import:
      - optional:nacos:common.yaml
  application:
    name: zxds-odr
  cloud:
    nacos:
      config:
        group: DEFAULT_GROUP
        file-extension: yaml
        server-addr: 192.168.48.200:8848
        namespace: zxds
        username: nacos
        password: abc123456
      discovery:
        namespace: zxds
        username: nacos
        password: abc123456
        server-addr: 192.168.48.200:8848
        group: DEFAULT_GROUP
        ip: 192.168.1.5
    openfeign:
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 300000

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://192.168.48.200:12001/zxds_odr?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
      username: root
      password: abc123456
      initial-size: 4
      max-active: 8
      min-idle: 8
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  rabbitmq:
    host: 192.168.48.200
    port: 5672
    username: admin
    password: abc123456

  data:
    redis:
      database: 5
      host: 192.168.48.200
      port: 6379
      password: abc123456
      lettuce:
        pool:
          max-active: 1000
          max-wait: -1ms
          max-idle: 16
          min-idle: 8

  quartz:
    job-store-type: memory

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.example.zxds.odr.db.pojo
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    com.example.zxds.odr.db.dao: warn
  pattern:
    console: "%d{yyyy/MM/dd HH:mm:ss}  %-5level  %msg%n"

springdoc:
  api-docs:
    enabled: true
    path: /doc-api.html
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: on

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: default_tx_group
  registry:
    type: nacos
    nacos:
      server-addr: 192.168.48.200:8848
      application: seata-server
      group: DEFAULT_GROUP
      namespace: zxds
      username: nacos
      password: abc123456
  config:
    type: nacos
    nacos:
      server-addr: 192.168.48.200:8848
      group: SEATA_GROUP
      data-id: seataClient.properties
      namespace: zxds
      username: nacos
      password: abc123456
xxl:
  job:
    admin:
      addresses: http://192.168.48.200:8081/xxl-job-admin # 调度中心的部署地址
    accessToken: default_token # 通信令牌，需与调度中心一致
    executor:
      appname: zxds-odr-executor # 执行器名称（需在后台注册一致）
      port: 9999 # 执行器通信端口（防止和微服务端口冲突）
      logpath: ./logs/xxl-job/jobhandler # 执行器日志存放路径
      logretentiondays: 30 # 执行器日志保留天数