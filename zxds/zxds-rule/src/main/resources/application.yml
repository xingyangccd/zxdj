server:
  jetty:
    threads:
      acceptors: 4
      selectors: 8
  port: 8006
  servlet:
    context-path: /

spring:
  config:
    import:
      - optional:nacos:common.yaml
      - optional:nacos:seataClient.properties
  application:
    name: zxds-rule
  cloud:
    nacos:
      config:
        group: DEFAULT_GROUP
        file-extension: yaml
        server-addr: 192.168.48.200:8848
        namespace: zxds
        username: nacos
        password: abc123456
      discovery:
        namespace: zxds
        username: nacos
        password: abc123456
        server-addr: 192.168.48.200:8848
        group: DEFAULT_GROUP
        ip: 192.168.1.5
    openfeign:
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 300000

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://192.168.48.200:12001/zxds_rule?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
      username: root
      password: abc123456
      initial-size: 4
      max-active: 8
      min-idle: 8
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.example.zxds.rule.db.pojo
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    com.example.zxds.rule.db.dao: warn
  pattern:
    console: "%d{yyyy/MM/dd HH:mm:ss}  %-5level  %msg%n"

springdoc:
  api-docs:
    enabled: true
    path: /doc-api.html
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: on

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: default_tx_group
  registry:
    type: nacos
    nacos:
      server-addr: 192.168.48.200:8848
      application: seata-server
      group: DEFAULT_GROUP
      namespace: zxds
      username: nacos
      password: abc123456
  config:
    type: nacos
    nacos:
      server-addr: 192.168.48.200:8848
      group: SEATA_GROUP
      data-id: seataClient.properties
      namespace: zxds
      username: nacos
      password: abc123456